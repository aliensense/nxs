# yaml-language-server: $schema=../schemas/unit-driver.schema.json
# MC6470 driver for NXS VM.
# Parameter capabilities; order fixes the wire's param
# indices, so entries never reorder.
meta:
  driver: mc6470
params:
  - {name: sample_rate, values: [1, 2, 4, 8, 16, 32, 64, 128, 256], default: 64, unit: Hz}
  - {name: accel_fs, values: [2, 4, 8, 16], default: 8, unit: g}
  - {name: mag_odr, values: [10, 20, 100], default: 100, unit: Hz}
  - {name: mag_res, values: [14, 15], default: 15, unit: bit}
