# yaml-language-server: $schema=../schemas/unit-driver.schema.json
# FXOS8700 driver for NXS VM.
# Parameter capabilities; order fixes the wire's param
# indices, so entries never reorder.
meta:
  driver: fxos8700
params:
  - {name: sample_rate, values: [400, 200, 100, 50, 25], default: 100, unit: Hz}
  - {name: accel_fs, values: [2, 4, 8], default: 4, unit: g}
