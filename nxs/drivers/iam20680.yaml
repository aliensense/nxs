# yaml-language-server: $schema=../schemas/unit-driver.schema.json
# IAM-20680 driver for NXS VM.
# Parameter capabilities; order fixes the wire's param
# indices, so entries never reorder.
meta:
  driver: iam20680
params:
  - {name: sample_rate, values: [10, 25, 50, 100, 200, 250], default: 100, unit: Hz}
  - {name: accel_fs, values: [2, 4, 8, 16], default: 8, unit: g}
  - {name: gyro_fs, values: [250, 500, 1000, 2000], default: 2000, unit: dps}
  - {name: accel_bw, values: [5, 10, 21, 45, 99, 218, 420], default: 420, unit: Hz}
  - {name: gyro_bw, values: [5, 10, 20, 41, 92, 176], default: 176, unit: Hz}
