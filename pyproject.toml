[build-system]
requires = ["setuptools>=62"]
build-backend = "setuptools.build_meta"

[project]
name = "aliensense-nxs"
version = "1.1.0"
description = "NXS sensor VM compiler, suite manager, and command-line tool"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Aliensense"}]
# The I2C install: smbus2 for the bus, ruamel.yaml to edit the manifest round-trip,
# pyyaml to read every other YAML, argcomplete for the shell.
dependencies = [
    "argcomplete",
    "pyyaml",
    "ruamel.yaml",
    "smbus2",
]

# The Cyphal wires are the library's; the extra adds pyserial for the serial
# port autodetect and the bench's port sweep.
[project.optional-dependencies]
cyphal = [
    "pyserial",
]
# `nxs mcp` serves the verbs to an AI agent over the Model Context Protocol;
# the SDK pulls pydantic and an HTTP stack, so it stays an extra.
mcp = [
    "mcp>=2,<3",
]
# `nxs ros2` runs inside a sourced ROS 2 environment (rclpy comes from the
# distro, not from pip); the extra is the install marker the verb names.
ros2 = []

# `pip install` this project and `nxs` drops into PATH as a
# real executable. Points at nxs/cli.py::main().
[project.scripts]
nxs = "nxs.cli:main"
nxsd = "nxs.daemon:main"

[tool.setuptools.packages.find]
include = ["nxs*"]
exclude = ["nxs.tests*"]

# The vendored DSDL ships in the wheel so `aliensense-nxs[cyphal]` is self-contained; the
# ros2/ data (launch file, RViz config) ships too, found via `nxs ros2 --launch-file`.
# The quiet hub (hubs/<hub>: the manifest, the flows, the wiring, the
# serdes facts with their blobs, the hub license) is exported there by
# release.sh before the build and is git-ignored.
[tool.setuptools.package-data]
nxs = [
    "dsdl/**/*.dsdl", "dsdl/*.md", "dsdl/LICENSE-*", "ros2/*.launch.py", "ros2/*.rviz",
    "host/*.rules", "click_personalities/*/*.py", "click_personalities/*/*.yaml", "schemas/*.json",
    "hubs/*/hub.yaml", "hubs/*/topology.yaml", "hubs/*/flows.py", "hubs/*/flows/*.py",
    "hubs/*/LICENSE-*",
    "hubs/*/*/*.yaml", "hubs/*/*/*.py", "hubs/*/*/blobs/*.yaml",
    "_lib/libnxs.*",
]

[project.urls]
Homepage = "https://aliensense.github.io/nxs-docs/"
Documentation = "https://aliensense.github.io/nxs-docs/"
Repository = "https://github.com/aliensense/nxs"
