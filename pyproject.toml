[build-system]
requires = ["setuptools>=62"]
build-backend = "setuptools.build_meta"

[project]
name = "nxs"
version = "1.0.0"
description = "NXS sensor VM compiler, suite manager, and command-line tool"
readme = "README.md"
requires-python = ">=3.10"
# One wheel covers every transport: pyserial (UART), smbus2 (I2C).
# All are small pure-Python packages, so none earns an extra —
# a bare install must work on the default transport. ruamel.yaml is the
# round-trip YAML editor `suite freeze` uses to update the manifest
# without destroying the operator's comments.
dependencies = [
    "pyserial",
    "pyyaml",
    "ruamel.yaml",
    "smbus2",
]

# Cyphal is the one heavy transport — pycyphal pulls numpy + the DSDL
# toolchain (~100 MB) — so it stays an extra. The I2C/serial install, and
# the i2c container variant, never carry it. smbus2/pyserial stay in the
# base above (a bare install works on the default I2C transport), so there
# is no symmetric `[i2c]` extra: those few KB are not worth gating.
[project.optional-dependencies]
cyphal = [
    "pycyphal==1.27.0",
    "nunavut==2.3.1",
    "pydsdl==1.24.3",
    "cobs==1.2.2",
]

# `pip install` this project and `nxs` drops into PATH as a
# real executable. Points at nxs/cli.py::main().
[project.scripts]
nxs = "nxs.cli:main"

[tool.setuptools.packages.find]
include = ["nxs*"]
exclude = ["nxs.tests*"]

# Vendored DSDL ships in the wheel so `nxs[cyphal]` is self-contained —
# the source compiles it at first run with no repo checkout or PRDT clone.
# The ros2/ data (launch file + RViz config) ships too, located at runtime
# via `nxs ros2 --launch-file`.
[tool.setuptools.package-data]
nxs = ["dsdl/**/*.dsdl", "dsdl/*.md", "ros2/*.launch.py", "ros2/*.rviz"]
