name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e '.[cyphal]' pytest build

      - name: Test
        run: python -m pytest nxs/tests/ -q

      - name: Build wheel
        run: python -m build --wheel
